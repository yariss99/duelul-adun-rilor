<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DUELUL ADUNĂRILOR – adunări cu numere de 1–6 cifre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg1:#0f6b78;--bg2:#2c2370;--ink:#1b2150;--card:#fff9f3;--soft:#efe6f7;--on:#fff;--gold:#ffd23f;--ok:#17a15a;--bad:#e5263f;--muted:#5b6190;--glass:rgba(255,255,255,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a4a54;--bg2:#1c1650;--card:#f4ede6;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0a4a54;--bg2:#1c1650;--card:#f4ede6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--on);font-family:"Baloo 2",system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none;touch-action:manipulation}
.scr{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit}
/* setup */
#setup{align-items:center;justify-content:center;gap:2vmin;padding:3vmin;overflow:auto;text-align:center}
#setup img{width:min(18vmin,110px)}
#setup h1{margin:0;font-size:clamp(34px,8vmin,76px);line-height:1;color:var(--gold)}
#setup p{margin:0;font-size:clamp(16px,2.6vmin,26px);opacity:.9}
.row{display:flex;gap:1.2vmin;flex-wrap:wrap;justify-content:center;align-items:center}
.row>span{font-size:clamp(15px,2.4vmin,24px);min-width:7em;text-align:right;opacity:.9}
.seg{padding:.5em 1.1em;border-radius:999px;background:var(--glass);font-size:clamp(16px,2.8vmin,28px);font-weight:700;border:3px solid transparent}
.seg.on{background:var(--gold);color:var(--ink)}
.names{display:flex;gap:1vmin;flex-wrap:wrap;justify-content:center}
.names input{width:min(24vmin,170px);font:inherit;font-weight:700;font-size:clamp(15px,2.4vmin,22px);text-align:center;padding:.35em;border-radius:12px;border:4px solid var(--c);background:#fff;color:var(--ink)}
.big{padding:.45em 1.8em;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:800;font-size:clamp(22px,4.4vmin,44px);box-shadow:0 .5vmin 0 #b58a00}
.big:active{transform:translateY(2px)}
/* game */
.bar{display:flex;align-items:center;gap:1.4vmin;padding:1.2vmin 2vmin}
.bar img{height:6vmin;min-height:34px}
.bar b{font-size:clamp(17px,3.2vmin,32px)}
.pill{background:#0008;border:3px solid var(--gold);border-radius:999px;padding:0 1em;font-weight:800;font-size:clamp(16px,3vmin,30px);margin:0 auto}
.bt{display:flex;gap:1vmin}
.bt button{background:var(--card);color:var(--ink);border-radius:12px;padding:.2em .8em;font-weight:700;font-size:clamp(14px,2.4vmin,24px)}
.ban{margin:0 auto;padding:.1em 1.4em;border:3px solid var(--gold);border-radius:14px;background:#13206b;font-weight:700;font-size:clamp(16px,2.8vmin,28px);text-align:center;min-width:min(90%,60vmin)}
#teams{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.2vmin;padding:1.4vmin 2vmin;flex:1;min-height:0}
@media (max-aspect-ratio:1/1){#teams{grid-template-columns:repeat(2,1fr)}}
.tm{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--card);color:var(--ink);border:.9vmin solid var(--c);border-radius:2vmin;padding:1vmin;transition:transform .2s,box-shadow .3s}
.tm.won{box-shadow:0 0 0 1vmin var(--gold),0 0 5vmin var(--gold);transform:scale(1.02)}
.tm.shk{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-1.2vmin)}75%{transform:translateX(1.2vmin)}}
.th{display:flex;align-items:center;gap:1vmin;background:var(--c);color:#fff;border-radius:1.2vmin;padding:0 1vmin;font-weight:800;font-size:clamp(15px,2.8vmin,28px)}
.th b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .st{font-size:.8em;letter-spacing:.05em;color:var(--gold)}
.th i{font-style:normal;background:#0006;border-radius:99px;padding:0 .6em}
.pb{display:flex;justify-content:center;padding:.6vmin 0}
.vert{display:grid;--cw:1.15em;font-size:clamp(22px,5.4vmin,62px);font-weight:800;line-height:1.1;row-gap:.08em}
.vert>div{display:flex;align-items:center;justify-content:center;height:1.1em}
.vert .sg{color:var(--c,var(--ink))}
.vert .rule{grid-column:1/-1;height:.07em;background:var(--ink);border-radius:2px}
.vert .tp{height:.7em;font-size:.55em;color:var(--bad)}
.vert .x{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:.08em;opacity:.7}
.vert .rs{color:var(--ok)}
.hid .dg{visibility:hidden}
.bx{width:calc(var(--cw) - .12em);height:1.05em;border:.07em dashed var(--c);border-radius:.18em;background:#fff;color:var(--ink);font-size:1em}
.bx.cur{border-style:solid;animation:pl 1s infinite}
@keyframes pl{50%{background:var(--soft)}}
.kp{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:.9vmin;margin-top:.8vmin}
.kp button{background:var(--c);color:#fff;border-radius:1.2vmin;font-weight:800;font-size:clamp(20px,4.6vmin,52px);box-shadow:0 .5vmin 0 #0004;min-height:0}
.kp button:active{transform:translateY(2px);filter:brightness(1.15)}
.kp .dl{background:#fff;color:var(--c);border:.5vmin solid var(--c)}
.lk{position:absolute;inset:0;background:#000b;border-radius:1.2vmin;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(22px,5vmin,52px)}
#ctl{display:flex;justify-content:center;padding:0 0 1.6vmin;min-height:8vmin}
.cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:30vmin;font-weight:800;color:var(--gold);text-shadow:0 1vmin 0 #0006;pointer-events:none;z-index:15;animation:pop .9s}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{opacity:1}100%{transform:scale(1.25);opacity:0}}
/* overlay */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:2vmin}
.cardp{background:var(--card);color:var(--ink);border-radius:3vmin;padding:3vmin 4vmin;text-align:center;max-width:min(94vw,820px);max-height:96vh;overflow:auto}
.cardp .tag{display:inline-block;background:var(--gold);color:var(--ink);border-radius:99px;padding:0 1em;font-weight:800;font-size:clamp(15px,2.6vmin,26px)}
.cardp h2{margin:.1em 0;font-size:clamp(34px,8vmin,84px);color:var(--c);line-height:1.05}
.cardp .sub{font-size:clamp(14px,2.2vmin,22px);color:var(--muted)}
.cardp .vert{margin:1vmin auto;width:max-content;font-size:clamp(26px,7vmin,70px)}
.sc{display:flex;gap:1vmin;justify-content:center;flex-wrap:wrap;margin:1vmin 0 2vmin}
.sc span{background:var(--c);color:#fff;border-radius:99px;padding:0 .9em;font-weight:800;font-size:clamp(14px,2.4vmin,24px)}
.fin{position:relative;text-align:center;color:#fff;max-width:96vw}
.fin .tr{font-size:clamp(90px,26vmin,260px);line-height:1;animation:bn 1.2s infinite}
@keyframes bn{50%{transform:translateY(-2.5vmin) rotate(-4deg)}}
.fin p{margin:0;font-size:clamp(18px,4vmin,40px);font-weight:700;color:var(--gold)}
.fin h2{margin:.05em 0;font-size:clamp(46px,15vmin,160px);line-height:1;color:var(--c,#fff);background:#fff;border-radius:.3em;padding:.05em .45em;display:inline-block;box-shadow:0 0 0 .6vmin var(--gold),0 0 8vmin var(--gold);animation:gl 1.6s infinite alternate}
@keyframes gl{to{box-shadow:0 0 0 .9vmin var(--gold),0 0 14vmin var(--gold)}}
.rk{display:flex;gap:1.4vmin;justify-content:center;flex-wrap:wrap;margin:2.4vmin 0}
.rk div{background:var(--glass);border:.5vmin solid var(--c);border-radius:2vmin;padding:.2em 1em;font-weight:800;font-size:clamp(16px,3vmin,30px)}
.rk div.w{background:var(--gold);color:var(--ink)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.fin .tr,.fin h2,.bx.cur{animation:none}}
</style>
</head>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var COL=['#ec2f6b','#2a7bff','#1fb66a','#ff8a1f'];
var S={n:3,c:1,rounds:5,d:3,snd:true,names:['Echipa 1','Echipa 2','Echipa 3','Echipa 4'],T:[],r:0,ph:'setup',p:null,tok:0};
/* ---------- sunet ---------- */
var AC=null;
function tone(f,t,d,ty,v){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.18,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
function snd(k){if(k==='ok'){tone(660,0,.18);tone(880,.15,.3)}else if(k==='bad'){tone(150,0,.35,'sawtooth',.12)}else if(k==='tick'){tone(520,0,.12)}else if(k==='go'){tone(880,0,.4)}else if(k==='key'){tone(400,0,.05,'square',.04)}else if(k==='win'){[523,659,784,1046,784,1046,1318].forEach(function(f,i){tone(f,i*.16,.4)})}}
/* ---------- generator ---------- */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function carries(a,b){var x=String(a).split('').reverse().map(Number),y=String(b).split('').reverse().map(Number),c=0,k=0;for(var i=0;i<Math.max(x.length,y.length);i++){var t=(x[i]||0)+(y[i]||0)+c;c=t>=10?1:0;k+=c}return k}
function gen(d,cr){var lo=d===1?1:Math.pow(10,d-1),hi=Math.pow(10,d)-1,need=cr?(d<=2?1:2):0;
for(var k=0;k<3000;k++){var a=rnd(lo,hi),b=rnd(lo,hi);if(carries(a,b)>=need)return{a:a,b:b,r:a+b}}return{a:7,b:8,r:15}}
/* ---------- grila coloana ---------- */
function grid(n,rows){var cols='.9em '+new Array(n+1).join('var(--cw) ');return '<div class="vert" style="grid-template-columns:'+cols+'">'+rows+'</div>'}
function cells(lead,arr,cls){var h='<div class="'+(lead?'sg':'')+'">'+(lead||'')+'</div>';arr.forEach(function(x){h+='<div class="'+(cls||'')+'">'+x+'</div>'});return h}
function pad(s,n){var a=String(s).split('');while(a.length<n)a.unshift('');return a}
function problem(p,n,i){
var A=pad(p.a,n),B=pad(p.b,n),bx='',m=String(p.r).length;for(var j=0;j<n;j++)bx+=j<n-m?'<div></div>':'<div><div class="bx" data-j="'+j+'"></div></div>';
return grid(n,cells('',A,'dg')+cells('+',B,'dg')+'<div class="rule"></div><div></div>'+bx)}
function solution(p,n){
var A=pad(p.a,n),B=pad(p.b,n),R=pad(String(p.r),n),top=[],c=0,j;for(j=0;j<n;j++)top.push('');
for(j=n-1;j>=0;j--){var t=Number(A[j]||0)+Number(B[j]||0)+c;c=t>=10?1:0;if(c&&j>0)top[j-1]='1'}
return grid(n,cells('',top,'tp')+cells('',A,'')+cells('+',B,'')+'<div class="rule"></div>'+cells('',R,'rs'))}
/* ---------- setup ---------- */
function seg(id,vals,key,lab){var h='';vals.forEach(function(v){h+='<button class="seg'+(S[key]===v?' on':'')+'" data-v="'+v+'">'+(lab?lab(v):v)+'</button>'});$(id).innerHTML=h;
$(id).onclick=function(e){var b=e.target.closest('button');if(!b)return;S[key]=Number(b.dataset.v);seg(id,vals,key,lab);if(key==='n')names()}}
function names(){var h='';for(var i=0;i<S.n;i++)h+='<input style="--c:'+COL[i]+'" value="'+S.names[i]+'" aria-label="Numele echipei '+(i+1)+'" maxlength="14" data-i="'+i+'">';$('nm').innerHTML=h}
$('nm').oninput=function(e){if(e.target.dataset.i!==undefined)S.names[e.target.dataset.i]=e.target.value}
function setup(){S.tok++;S.ph='setup';$('setup').hidden=false;$('game').hidden=true;$('ov').hidden=true;stopCf();
seg('gN',[2,3,4],'n');seg('gR',[3,5,7],'rounds');seg('gD',[1,2,3,4,5,6],'d',function(v){return v+(v===1?' cifră':' cifre')});seg('gC',[1,0],'c',function(v){return v?'Cu trecere peste ordin':'Mixt'});names()}
/* ---------- joc ---------- */
function start(){S.T=[];for(var i=0;i<S.n;i++)S.T.push({name:(S.names[i]||'Echipa '+(i+1)).trim()||'Echipa '+(i+1),sc:0,ans:[],lock:false});S.r=0;
$('setup').hidden=true;$('game').hidden=false;AC=AC||null;nextRound()}
function stars(t){var s='';for(var i=0;i<S.rounds;i++)s+=i<t.sc?'★':'☆';return s}
function nextRound(){S.r++;S.p=gen(S.d,S.c);S.ph='ready';S.tok++;
S.T.forEach(function(t){t.ans=[];t.lock=false});
$('rd').textContent='Tura '+S.r+' / '+S.rounds;$('ban').textContent='Gata de start? Apăsați „Start tura”';$('go').hidden=false;
var n=String(S.p.r).length,h='';
S.T.forEach(function(t,i){h+='<div class="tm" data-i="'+i+'" style="--c:'+COL[i]+'"><div class="th"><b>'+esc(t.name)+'</b><span class="st">'+stars(t)+'</span><i>'+t.sc+'</i></div><div class="pb hid">'+problem(S.p,n,i)+'</div><div class="kp">'+keys()+'</div></div>'});
$('teams').style.setProperty('--n',S.n);$('teams').innerHTML=h;fit();cur()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function keys(){var h='';[1,2,3,4,5,6,7,8,9].forEach(function(k){h+='<button data-k="'+k+'">'+k+'</button>'});return h+'<button class="dl" data-k="d" aria-label="Șterge">⌫</button><button data-k="0">0</button><span></span>'}
function panel(i){return $('teams').children[i]}
function cur(){var n=String(S.p.r).length;S.T.forEach(function(t,i){var bs=panel(i).querySelectorAll('.bx');bs.forEach(function(b){var j=Number(b.dataset.j),v=t.ans[n-1-j];b.textContent=v===undefined?'':v;b.classList.toggle('cur',S.ph==='play'&&!t.lock&&j===n-1-t.ans.length)})})}
$('go').onclick=function(){if(S.ph!=='ready')return;S.ph='cd';$('go').hidden=true;var tk=S.tok,c=3;
function step(){if(tk!==S.tok)return;if(c>0){var d=document.createElement('div');d.className='cd';d.textContent=c;document.body.appendChild(d);setTimeout(function(){d.remove()},900);snd('tick');c--;setTimeout(step,1000)}
else{S.ph='play';snd('go');document.querySelectorAll('.pb').forEach(function(x){x.classList.remove('hid')});$('ban').textContent='Scrie suma, începând cu unitățile (din dreapta)';cur()}}
step()};
$('teams').addEventListener('pointerdown',function(e){var b=e.target.closest('button[data-k]');if(!b)return;e.preventDefault();var i=Number(b.closest('.tm').dataset.i),t=S.T[i];if(S.ph!=='play'||t.lock)return;var n=String(S.p.r).length,k=b.dataset.k;
if(k==='d'){t.ans.pop();snd('key');cur();return}
if(t.ans.length>=n)return;t.ans.push(k);snd('key');cur();
if(t.ans.length===n){var v=Number(t.ans.slice().reverse().join(''));if(v===S.p.r)win(i);else wrong(i)}});
function wrong(i){var t=S.T[i],p=panel(i),tk=S.tok;t.lock=true;snd('bad');p.classList.add('shk');setTimeout(function(){p.classList.remove('shk')},400);
var l=document.createElement('div');l.className='lk';p.appendChild(l);var s=2;l.textContent='🔒 '+s+' s';
var iv=setInterval(function(){s--;if(tk!==S.tok||s<=0){clearInterval(iv);l.remove();if(tk===S.tok){t.lock=false;t.ans=[];cur()}}else l.textContent='🔒 '+s+' s'},1000)}
function win(i){S.ph='pop';S.tok++;var t=S.T[i];t.sc++;snd('ok');document.querySelectorAll('.lk').forEach(function(x){x.remove()});
panel(i).classList.add('won');panel(i).querySelector('.st').textContent=stars(t);panel(i).querySelector('.th i').textContent=t.sc;$('ban').textContent=t.name+' a câștigat tura!';
var tk=S.tok;setTimeout(function(){if(tk===S.tok)pop(i)},900)}
function sb(){var h='';S.T.forEach(function(t,i){h+='<span style="--c:'+COL[i]+'">'+esc(t.name)+': '+t.sc+'</span>'});return '<div class="sc">'+h+'</div>'}
function pop(i){var last=S.r>=S.rounds,n=String(S.p.r).length;
$('ov').innerHTML='<div class="cardp" style="--c:'+COL[i]+'"><span class="tag">Tura '+S.r+' câștigată de</span><h2>'+esc(S.T[i].name)+'</h2><div class="sub">Rezolvarea corectă</div>'+solution(S.p,n)+sb()+'<button class="big" id="nx">'+(last?'Vezi câștigătorul':'Tura următoare')+'</button></div>';
$('ov').hidden=false;$('nx').onclick=function(){$('ov').hidden=true;if(last)final();else nextRound()}}
/* ---------- final ---------- */
function final(){S.ph='fin';var mx=Math.max.apply(null,S.T.map(function(t){return t.sc})),W=[];S.T.forEach(function(t,i){if(t.sc===mx)W.push(i)});
var tie=W.length>1,rk=S.T.map(function(t,i){return{t:t,i:i}}).sort(function(a,b){return b.t.sc-a.t.sc}),h='';
rk.forEach(function(x){h+='<div class="'+(x.t.sc===mx?'w':'')+'" style="--c:'+COL[x.i]+'">'+(x.t.sc===mx?'👑 ':'')+esc(x.t.name)+' · '+x.t.sc+' / '+S.rounds+'</div>'});
var head=tie?'Egalitate! Câștigători':'Câștigătorul este',nm=W.map(function(i){return '<h2 style="--c:'+COL[i]+'">'+esc(S.T[i].name)+'</h2>'}).join(' ');
$('ov').innerHTML='<div class="fin"><div class="tr">🏆</div><p>'+head+'</p>'+nm+'<div class="rk">'+h+'</div><div class="row"><button class="big" id="again">Joacă din nou</button><button class="seg" id="stg">Setări</button></div></div>';
$('ov').hidden=false;snd('win');confetti();$('again').onclick=function(){$('ov').hidden=true;stopCf();start()};$('stg').onclick=setup}
/* ---------- confetti ---------- */
var cfRun=false;
function stopCf(){cfRun=false;$('cf').hidden=true}
function confetti(){var c=$('cf'),x=c.getContext('2d');c.hidden=false;c.width=innerWidth;c.height=innerHeight;cfRun=true;var P=[],cs=COL.concat(['#ffd23f','#fff']);
for(var i=0;i<170;i++)P.push({x:Math.random()*c.width,y:-Math.random()*c.height,w:6+Math.random()*9,h:10+Math.random()*10,v:2+Math.random()*4,s:Math.random()*2-1,a:Math.random()*6,r:Math.random()*.2-.1,c:cs[i%cs.length]});
(function f(){if(!cfRun)return;x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.y+=p.v;p.x+=p.s+Math.sin(p.a)*1.2;p.a+=p.r+.05;if(p.y>c.height){p.y=-20;p.x=Math.random()*c.width}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});requestAnimationFrame(f)})()}
function fit(){if(S.ph==='setup'||!S.p)return;var n=String(S.p.r).length,base=Math.max(20,Math.min(62,.054*Math.min(innerWidth,innerHeight)));document.querySelectorAll('#teams .pb').forEach(function(pb){var fs=Math.min(base,pb.clientWidth*.94/(n*1.15+.9));pb.firstChild.style.fontSize=fs+'px'})}
addEventListener('resize',fit);
/* ---------- butoane ---------- */
$('play').onclick=function(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}start()};
$('bSet').onclick=setup;
$('bSnd').onclick=function(){S.snd=!S.snd;$('bSnd').textContent=S.snd?'🔊':'🔇'};
$('bFs').onclick=function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}};
setup();
})();
</script>
</body>
